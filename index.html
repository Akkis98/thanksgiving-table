<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thanksgiving at Ahmed's</title>
<meta property="og:title" content="Thanksgiving at Ahmed's">
<meta property="og:description" content="Tell us what you're bringing and watch the table fill up.">
<meta name="theme-color" content="#f6ecd9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6ecd9;
    --paper: #fffaf0;
    --ink: #3a2413;
    --ink-soft: #7a5a41;
    --cranberry: #9c2b2e;
    --cranberry-dark: #7c1f22;
    --pumpkin: #d9742b;
    --sage: #6f8458;
    --wood: #7b4e2b;
    --wood-dark: #58361c;
    --line: #e3d3b6;
    --display: "Fraunces", Georgia, serif;
    --hand: "Caveat", "Bradley Hand", cursive;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 50% -100px, #fbe3b8 0%, transparent 70%),
      var(--cream);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    overflow-x: hidden;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- header ---------- */
  header { text-align: center; padding: 36px 0 20px; }
  .eyebrow {
    font-family: var(--display); font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; font-size: 12px; color: var(--pumpkin);
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(38px, 10vw, 64px);
    line-height: 1; margin: 10px 0 12px; letter-spacing: -.02em; text-wrap: balance;
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--cranberry); }
  .lede { color: var(--ink-soft); margin: 0 auto; max-width: 30em; text-wrap: pretty; }
  .countdown {
    display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line);
    font-family: var(--hand); font-size: 21px; font-weight: 700; color: var(--cranberry);
    transform: rotate(-1.5deg);
  }

  /* ---------- form card ---------- */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
    padding: 20px; box-shadow: 0 10px 30px rgba(88, 54, 28, .10);
  }
  .card h2, .section-title {
    font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0 0 14px; letter-spacing: -.01em;
  }
  .dish-row { display: flex; gap: 14px; align-items: center; }
  .preview {
    flex: none; width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff 0 50%, #efe7d8 51% 59%, #fff 60% 100%);
    box-shadow: 0 5px 10px rgba(58, 36, 19, .22), inset 0 0 0 1px #e3dccf;
    display: grid; place-items: center; font-size: 36px;
  }
  .preview.pop { animation: pop .3s ease; }
  @keyframes pop { 40% { transform: scale(1.14) rotate(-6deg); } }
  .fields { flex: 1; min-width: 0; display: grid; gap: 10px; }
  label.lbl {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 6px;
  }
  input[type=text] {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]::placeholder { color: #b9a58d; }
  input[type=text]:focus { border-color: var(--pumpkin); box-shadow: 0 0 0 3px rgba(217, 116, 43, .18); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; }
  .chip span {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    border: 1.5px solid var(--line); background: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; user-select: none; transition: all .15s;
  }
  .chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip input:focus-visible + span { box-shadow: 0 0 0 3px rgba(217, 116, 43, .35); }
  .hint {
    margin: 10px 0 0; font-family: var(--hand); font-size: 20px; line-height: 1.2; color: var(--cranberry);
    min-height: 0;
  }
  .hint:empty { display: none; }
  .btn {
    font: inherit; font-family: var(--display); font-weight: 800; font-size: 18px;
    border: 0; border-radius: 14px; padding: 14px 18px; cursor: pointer;
    background: var(--cranberry); color: #fff; width: 100%; margin-top: 18px;
    box-shadow: 0 4px 0 var(--cranberry-dark); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cranberry-dark); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn.ghost {
    background: transparent; color: var(--ink); box-shadow: none; border: 1.5px solid var(--line);
    font-family: var(--body); font-weight: 600; font-size: 15px; margin-top: 10px;
  }
  .btn.danger { background: #fff; color: var(--cranberry); border: 1.5px solid var(--cranberry); box-shadow: none; font-size: 16px; }
  .banner {
    margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: #fff3cd; border: 1px solid #ecd58a;
    font-size: 14px;
  }
  .banner[hidden] { display: none; }

  /* ---------- tally ---------- */
  .tally { text-align: center; margin: 34px 0 14px; }
  .tally .big { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
  .tally .needs { font-family: var(--hand); font-size: 21px; color: var(--cranberry); margin-top: 2px; }

  /* ---------- the table ---------- */
  .table {
    position: relative; border-radius: 30px; padding: 18px 14px 26px;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.05) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(88deg, rgba(255,255,255,.035) 0 2px, transparent 2px 110px),
      linear-gradient(180deg, #8d5b33, #6f4526);
    border: 7px solid var(--wood-dark);
    box-shadow: 0 22px 40px rgba(58, 36, 19, .35), inset 0 0 60px rgba(0,0,0,.25);
  }
  .centerpiece { display: flex; flex-direction: column; align-items: center; padding: 6px 0 4px; position: relative; }
  .turkey {
    font-size: 72px; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.35)); -webkit-tap-highlight-color: transparent;
  }
  .turkey.wobble { animation: wobble .6s ease; }
  @keyframes wobble {
    20% { transform: rotate(-14deg) scale(1.1); } 45% { transform: rotate(11deg) scale(1.1); }
    70% { transform: rotate(-6deg); } 100% { transform: none; }
  }
  .bubble {
    margin-top: 10px; background: var(--paper); color: var(--ink); border-radius: 16px; padding: 8px 14px;
    font-family: var(--hand); font-size: 21px; line-height: 1.15; text-align: center; max-width: 280px;
    position: relative; box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .bubble::before {
    content: ""; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px;
    background: var(--paper); transform: translateX(-50%) rotate(45deg);
  }
  .course { margin-top: 22px; }
  .course-head {
    display: flex; align-items: center; gap: 10px; color: #f3dcbc;
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
  }
  .course-head::before, .course-head::after { content: ""; flex: 1; height: 1px; background: rgba(243, 220, 188, .35); }
  .plates { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 6px; margin-top: 14px; }
  .setting {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; width: 108px;
    -webkit-tap-highlight-color: transparent;
  }
  .plate {
    width: 82px; height: 82px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff 0 50%, #efe7d8 51% 59%, #fff 60% 100%);
    box-shadow: 0 7px 10px rgba(0,0,0,.4), inset 0 0 0 1px #e3dccf;
    display: grid; place-items: center; font-size: 38px; transition: transform .15s;
  }
  .setting:hover .plate, .setting:focus-visible .plate { transform: translateY(-3px) scale(1.04); }
  .setting:focus-visible { outline: none; }
  .setting:focus-visible .place-card { box-shadow: 0 0 0 3px var(--pumpkin); }
  .place-card {
    margin-top: -8px; background: var(--paper); border-radius: 5px; padding: 5px 8px 3px; max-width: 100%;
    box-shadow: 0 3px 6px rgba(0,0,0,.3); text-align: center; transform: rotate(var(--tilt, 0deg));
  }
  .place-card .what {
    font-family: var(--display); font-weight: 600; font-size: 13.5px; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .place-card .who {
    font-family: var(--hand); font-weight: 700; font-size: 18px; line-height: 1.05; color: var(--cranberry);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting.empty .plate {
    background: none; box-shadow: none; border: 2px dashed rgba(243, 220, 188, .55); font-size: 30px; color: rgba(243, 220, 188, .8);
  }
  .setting.empty .place-card { background: none; box-shadow: none; color: #f3dcbc; margin-top: 4px; transform: none; }
  .setting.empty .who { color: #f3dcbc; font-size: 19px; white-space: normal; }
  .setting.new { animation: drop .7s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes drop {
    0% { transform: translateY(-70px) scale(1.3) rotate(-8deg); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: none; }
  }

  /* ---------- guest list ---------- */
  .guests { margin-top: 36px; }
  .guest { display: flex; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line); }
  .guest:first-of-type { border-top: 0; }
  .guest .name { flex: none; width: 34%; font-family: var(--hand); font-weight: 700; font-size: 23px; line-height: 1.1; color: var(--cranberry); overflow-wrap: anywhere; }
  .guest ul { margin: 0; padding: 0; list-style: none; flex: 1; min-width: 0; }
  .guest li { padding: 1px 0; overflow-wrap: anywhere; }
  .guest li small { color: var(--ink-soft); }
  .muted { color: var(--ink-soft); }
  footer { text-align: center; color: var(--ink-soft); font-size: 13px; margin-top: 36px; }

  /* ---------- dialog ---------- */
  dialog {
    border: 0; border-radius: 24px; padding: 26px 22px 20px; width: min(360px, calc(100vw - 32px));
    background: var(--paper); color: var(--ink); text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.4);
  }
  dialog::backdrop { background: rgba(58, 36, 19, .55); }
  dialog .d-emoji { font-size: 64px; line-height: 1; }
  dialog h3 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 10px 0 4px; overflow-wrap: anywhere; }
  dialog .d-who { font-family: var(--hand); font-weight: 700; font-size: 24px; color: var(--cranberry); }
  dialog .d-note { margin: 10px 0 0; color: var(--ink-soft); overflow-wrap: anywhere; }
  dialog .d-note:empty { display: none; }

  /* ---------- leaves ---------- */
  .leaf { position: fixed; top: -40px; z-index: 50; pointer-events: none; font-size: 26px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 80px); z-index: 60;
    background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: transform .25s; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (min-width: 620px) {
    .card { padding: 28px; }
    .table { padding: 26px 26px 36px; }
    .setting { width: 128px; }
    .plate { width: 94px; height: 94px; font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Thursday, November 26</div>
    <h1>Thanksgiving <em>at</em> Ahmed's</h1>
    <p class="lede">Tell us what you're bringing and watch the table fill up. Food, drinks, dessert, plates, anything.</p>
    <div class="countdown" id="countdown"></div>
  </header>

  <form class="card" id="form" autocomplete="off" novalidate>
    <div class="banner" id="banner" hidden></div>
    <h2>What are you bringing?</h2>
    <div class="dish-row">
      <div class="preview" id="preview" aria-hidden="true">🍽️</div>
      <div class="fields">
        <input type="text" id="item" maxlength="80" placeholder="Mac and cheese" aria-label="What you are bringing" enterkeyhint="next">
        <input type="text" id="name" maxlength="40" placeholder="Your name" aria-label="Your name" autocomplete="given-name" enterkeyhint="next">
      </div>
    </div>
    <p class="hint" id="hint" role="status"></p>

    <label class="lbl" id="cat-lbl">It counts as</label>
    <div class="chips" id="chips" role="radiogroup" aria-labelledby="cat-lbl"></div>

    <label class="lbl" for="note">Anything we should know? (optional)</label>
    <input type="text" id="note" maxlength="140" placeholder="Feeds 8, has nuts, needs the oven" enterkeyhint="done">

    <button class="btn" id="submit" type="submit">Put it on the table</button>
  </form>

  <div class="tally">
    <div class="big" id="tally-big"></div>
    <div class="needs" id="tally-needs"></div>
  </div>

  <section class="table" aria-label="The table">
    <div class="centerpiece">
      <button class="turkey" id="turkey" type="button" aria-label="Poke the turkey">🦃</button>
      <div class="bubble" id="bubble" role="status">Poke me. I dare you.</div>
    </div>
    <div id="courses"></div>
  </section>

  <section class="guests">
    <h2 class="section-title">Who's bringing what</h2>
    <div id="guests"></div>
  </section>

  <footer>Changed your mind? Tap your plate to take it off the table.</footer>
</div>

<dialog id="dialog">
  <div class="d-emoji" id="d-emoji"></div>
  <h3 id="d-item"></h3>
  <div class="d-who" id="d-who"></div>
  <p class="d-note" id="d-note"></p>
  <button class="btn danger" id="d-remove" type="button">Take it off the table</button>
  <button class="btn ghost" id="d-close" type="button">Close</button>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   DATABASE SETTINGS
   Paste the two values from your Supabase project here (see README.md).
   While these are empty the page runs in preview mode: entries are saved
   only on the device that typed them.
   ===================================================================== */
const SUPABASE_URL = "";
const SUPABASE_KEY = "";

const PARTY_DATE = new Date(2026, 10, 26); // November 26, 2026

const CATS = [
  { id: "mains",    label: "Mains",             emoji: "🍗",  ask: "Who's on mains?" },
  { id: "sides",    label: "Sides",             emoji: "🥔",  ask: "Sides, anyone?" },
  { id: "desserts", label: "Desserts",          emoji: "🥧",  ask: "No dessert yet!" },
  { id: "drinks",   label: "Drinks",            emoji: "🍷",  ask: "We'll be thirsty" },
  { id: "supplies", label: "Plates & supplies", emoji: "🍽️", ask: "Plates? Cups?" },
  { id: "other",    label: "Something else",    emoji: "✨",  ask: "Surprise us" },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

// First match wins, so the specific ones come first.
const GUESSES = [
  [/hot chocolate|cocoa|eggnog/, "☕", "drinks"],
  [/ice ?cream|gelato/, "🍨", "desserts"], [/cheesecake/, "🍰", "desserts"], [/cupcake|muffin/, "🧁", "desserts"],
  [/pie|cobbler|tart/, "🥧", "desserts"], [/cake/, "🍰", "desserts"], [/cookie/, "🍪", "desserts"],
  [/brownie|chocolate|fudge/, "🍫", "desserts"], [/donut|doughnut/, "🍩", "desserts"],
  [/baklava|kunafa|knafeh|basbousa/, "🍯", "desserts"], [/pudding|flan|custard/, "🍮", "desserts"],
  [/fruit|grapes|berries|melon/, "🍇", "desserts"], [/candy|sweets/, "🍬", "desserts"], [/dessert/, "🥧", "desserts"],

  [/champagne|prosecco|bubbly|mimosa/, "🥂", "drinks"], [/wine|sangria/, "🍷", "drinks"], [/beer|ipa|lager/, "🍺", "drinks"],
  [/whiskey|bourbon|scotch|cocktail|liquor|vodka|tequila|rum\b/, "🥃", "drinks"], [/cider/, "🍎", "drinks"],
  [/lemonade/, "🍋", "drinks"], [/juice/, "🧃", "drinks"], [/soda|coke|sprite|pepsi|pop\b|seltzer|sparkling/, "🥤", "drinks"],
  [/coffee|espresso|hot chocolate|cocoa/, "☕", "drinks"], [/eggnog|milk/, "🥛", "drinks"], [/\btea\b|chai/, "🍵", "drinks"], [/water/, "💧", "drinks"], [/\bice\b/, "🧊", "drinks"],
  [/drink/, "🍷", "drinks"],

  [/plate|bowl/, "🍽️", "supplies"], [/cup|glasses/, "🥤", "supplies"], [/napkin|paper towel/, "🧻", "supplies"],
  [/fork|spoon|knife|knives|utensil|cutlery|silverware/, "🍴", "supplies"], [/chair|seat/, "🪑", "supplies"],
  [/foil|tupperware|container|to-?go|bags?\b/, "📦", "supplies"], [/candle/, "🕯️", "supplies"], [/flower/, "💐", "supplies"],
  [/game|cards/, "🎲", "supplies"], [/speaker|music|playlist/, "🎶", "supplies"], [/tablecloth|decor/, "🍂", "supplies"],

  [/turkey/, "🦃", "mains"], [/\bham\b|pork|ribs/, "🍖", "mains"], [/chicken|wings/, "🍗", "mains"],
  [/lamb|beef|brisket|steak|roast|kofta|kebab|meatball/, "🥩", "mains"], [/salmon|fish/, "🐟", "mains"],
  [/shrimp|seafood|crab/, "🍤", "mains"], [/lasagna|pasta|ziti|spaghetti/, "🍝", "mains"], [/pizza/, "🍕", "mains"],

  [/mac\b|mac ?(and|&|n) ?cheese|macaroni/, "🧀", "sides"], [/sweet potato|yam/, "🍠", "sides"], [/potato/, "🥔", "sides"],
  [/stuffing|dressing|bread|rolls?\b|biscuit|pita|cornbread/, "🥖", "sides"], [/cranberr/, "🍒", "sides"],
  [/gravy|soup|stew/, "🍲", "sides"], [/green bean|beans|peas/, "🫛", "sides"], [/corn/, "🌽", "sides"],
  [/salad|greens|collard|spinach/, "🥗", "sides"], [/rice|biryani|pilaf/, "🍚", "sides"], [/carrot/, "🥕", "sides"],
  [/brussels|broccoli|veg|squash|casserole/, "🥦", "sides"], [/hummus|dip|salsa|guac/, "🥑", "sides"],
  [/cheese|charcuterie|crackers|appetizer/, "🧀", "sides"], [/egg/, "🥚", "sides"],
];

function guess(text) {
  const t = (text || "").toLowerCase();
  for (const [re, emoji, cat] of GUESSES) if (re.test(t)) return { emoji, cat };
  return null;
}
const emojiFor = d => (guess(d.item)?.emoji) ?? (CAT[d.category]?.emoji ?? "✨");

/* ---------- storage: Supabase when configured, this device otherwise ---------- */
const $ = id => document.getElementById(id);
const LOCAL_KEY = "thanksgiving-table-preview";
const configured = Boolean(SUPABASE_URL && SUPABASE_KEY);

function localStore() {
  const read = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) ?? []; } catch { return []; } };
  const write = rows => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(rows)); } catch {} };
  return {
    async load() { return read(); },
    async add(d) {
      const row = { ...d, id: crypto.randomUUID(), created_at: new Date().toISOString() };
      write([...read(), row]); return row;
    },
    async remove(id) { write(read().filter(r => r.id !== id)); },
    watch() {},
  };
}

function remoteStore() {
  let client;
  const ready = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
    s.onload = () => { client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); resolve(); };
    s.onerror = () => reject(new Error("Could not load the database library"));
    document.head.appendChild(s);
  });
  return {
    async load() {
      await ready;
      const { data, error } = await client.from("dishes").select("*").order("created_at");
      if (error) throw error;
      return data;
    },
    async add(d) {
      await ready;
      const { data, error } = await client.from("dishes").insert(d).select().single();
      if (error) throw error;
      return data;
    },
    async remove(id) {
      await ready;
      const { error } = await client.from("dishes").delete().eq("id", id);
      if (error) throw error;
    },
    watch(onChange) {
      ready.then(() => {
        client.channel("dishes-live")
          .on("postgres_changes", { event: "*", schema: "public", table: "dishes" }, onChange)
          .subscribe();
      }).catch(() => {});
      // Safety net for phones that drop the live connection.
      setInterval(() => { if (!document.hidden) onChange(); }, 30000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) onChange(); });
    },
  };
}

const store = configured ? remoteStore() : localStore();
let dishes = [];
let freshId = null;
let catTouched = false;

/* ---------- rendering ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function tiltFor(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) | 0;
  return ((Math.abs(h) % 90) / 10 - 4.5).toFixed(1) + "deg";
}

function render() {
  const courses = $("courses");
  courses.replaceChildren();
  for (const cat of CATS) {
    const rows = dishes.filter(d => d.category === cat.id);
    if (cat.id === "other" && rows.length === 0) continue;
    const course = el("div", "course");
    course.append(el("div", "course-head", cat.label));
    const plates = el("div", "plates");
    for (const d of rows) {
      const b = el("button", "setting" + (d.id === freshId ? " new" : ""));
      b.type = "button";
      b.dataset.id = d.id;
      b.setAttribute("aria-label", `${d.item}, from ${d.name}`);
      b.append(el("div", "plate", emojiFor(d)));
      const card = el("div", "place-card");
      card.style.setProperty("--tilt", tiltFor(d.id));
      card.append(el("div", "what", d.item), el("div", "who", d.name));
      b.append(card);
      b.addEventListener("click", () => openDish(d));
      plates.append(b);
    }
    if (rows.length === 0) {
      const b = el("button", "setting empty");
      b.type = "button";
      b.append(el("div", "plate", "+"));
      const card = el("div", "place-card");
      card.append(el("div", "who", cat.ask));
      b.append(card);
      b.addEventListener("click", () => {
        pickCat(cat.id, true);
        $("form").scrollIntoView({ behavior: "smooth", block: "start" });
        setTimeout(() => $("item").focus({ preventScroll: true }), 400);
      });
      plates.append(b);
    }
    course.append(plates);
    courses.append(course);
  }

  // tally
  const people = new Set(dishes.map(d => d.name.trim().toLowerCase()));
  const n = dishes.length;
  $("tally-big").textContent = n === 0
    ? "The table is empty. Be the first."
    : `${n} ${n === 1 ? "thing" : "things"} on the table from ${people.size} ${people.size === 1 ? "person" : "people"}`;
  const missing = CATS.filter(c => c.id !== "other" && !dishes.some(d => d.category === c.id)).map(c => c.label.toLowerCase());
  $("tally-needs").textContent = n === 0 ? "" : missing.length === 0
    ? "Every course is covered. Now we feast."
    : `Still nobody on ${missing.length > 1 ? missing.slice(0, -1).join(", ") + " or " + missing.at(-1) : missing[0]}`;

  // guest list
  const guests = $("guests");
  guests.replaceChildren();
  if (n === 0) guests.append(el("p", "muted", "Nobody has signed up yet."));
  const byName = new Map();
  for (const d of dishes) {
    const key = d.name.trim().toLowerCase();
    if (!byName.has(key)) byName.set(key, { name: d.name.trim(), rows: [] });
    byName.get(key).rows.push(d);
  }
  for (const g of byName.values()) {
    const row = el("div", "guest");
    row.append(el("div", "name", g.name));
    const ul = el("ul");
    for (const d of g.rows) {
      const li = el("li", null, `${emojiFor(d)} ${d.item}`);
      if (d.note) { li.append(" "); li.append(el("small", null, `(${d.note})`)); }
      ul.append(li);
    }
    row.append(ul);
    guests.append(row);
  }
  freshId = null;
}

async function refresh() {
  try { dishes = await store.load(); render(); }
  catch (e) { toast("Couldn't reach the table. Check your connection."); }
}

/* ---------- form ---------- */
const chips = $("chips");
for (const cat of CATS) {
  const l = el("label", "chip");
  const i = el("input");
  i.type = "radio"; i.name = "cat"; i.value = cat.id;
  i.addEventListener("change", () => { catTouched = true; updatePreview(); });
  l.append(i, el("span", null, `${cat.emoji} ${cat.label}`));
  chips.append(l);
}
const currentCat = () => chips.querySelector("input:checked")?.value ?? null;
function pickCat(id, byUser) {
  const i = chips.querySelector(`input[value="${id}"]`);
  if (i) i.checked = true;
  if (byUser) catTouched = true;
  updatePreview();
}

let lastEmoji = "🍽️";
function updatePreview() {
  const item = $("item").value;
  const g = guess(item);
  const emoji = g?.emoji ?? CAT[currentCat()]?.emoji ?? "🍽️";
  if (emoji !== lastEmoji) {
    const p = $("preview");
    p.textContent = emoji; lastEmoji = emoji;
    p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
  }
}
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
function updateHint() {
  const typed = norm($("item").value);
  let msg = "";
  if (typed.length >= 4) {
    const me = norm($("name").value);
    const twin = dishes.find(d => {
      const other = norm(d.item);
      return other.length >= 4 && (other.includes(typed) || typed.includes(other)) && norm(d.name) !== me;
    });
    if (twin) msg = `Heads up: ${twin.name} is already bringing ${twin.item}. More is fine, just so you know.`;
  }
  $("hint").textContent = msg;
}
$("item").addEventListener("input", () => {
  const g = guess($("item").value);
  if (g && !catTouched) pickCat(g.cat, false);
  updatePreview(); updateHint();
});
$("name").addEventListener("input", updateHint);

try { $("name").value = localStorage.getItem("thanksgiving-name") ?? ""; } catch {}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const item = $("item").value.trim(), name = $("name").value.trim(), note = $("note").value.trim();
  if (!item) { toast("What are you bringing?"); $("item").focus(); return; }
  if (!name) { toast("Add your name so we know who to thank."); $("name").focus(); return; }
  const category = currentCat() ?? guess(item)?.cat ?? "other";
  const btn = $("submit");
  btn.disabled = true; btn.textContent = "Setting the table…";
  try {
    const row = await store.add({ name, item, category, note: note || null });
    try { localStorage.setItem("thanksgiving-name", name); } catch {}
    if (!dishes.some(d => d.id === row.id)) dishes.push(row);
    freshId = row.id;
    render();
    $("item").value = ""; $("note").value = ""; $("hint").textContent = "";
    catTouched = false;
    chips.querySelectorAll("input").forEach(i => { i.checked = false; });
    updatePreview();
    leaves();
    say(`${row.item}? ${pick(["Now we're talking.", "Bless you.", "You're my favorite.", "Finally, someone with taste.", "Better that than me."])}`);
    document.querySelector(`.setting[data-id="${row.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (err) {
    toast("That didn't save. Try once more.");
  } finally {
    btn.disabled = false; btn.textContent = "Put it on the table";
  }
});

/* ---------- dish dialog ---------- */
const dialog = $("dialog");
let openId = null, armed = false;
function openDish(d) {
  openId = d.id; armed = false;
  $("d-emoji").textContent = emojiFor(d);
  $("d-item").textContent = d.item;
  $("d-who").textContent = `from ${d.name}`;
  $("d-note").textContent = d.note ?? "";
  $("d-remove").textContent = "Take it off the table";
  dialog.showModal();
}
$("d-close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
$("d-remove").addEventListener("click", async () => {
  if (!armed) { armed = true; $("d-remove").textContent = "Sure? Tap again to remove"; return; }
  const id = openId;
  dialog.close();
  try {
    await store.remove(id);
    dishes = dishes.filter(d => d.id !== id);
    render();
    toast("Off the table.");
  } catch { toast("Couldn't remove it. Try once more."); }
});

/* ---------- the turkey ---------- */
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function say(text) {
  $("bubble").textContent = text;
  const t = $("turkey");
  t.classList.remove("wobble"); void t.offsetWidth; t.classList.add("wobble");
}
function turkeyLine() {
  const has = id => dishes.some(d => d.category === id);
  const lines = [
    "Gobble gobble.",
    "I was told this was a costume party.",
    "Have you considered a nice lasagna instead?",
    "I'm just here for the sides.",
    "Nobody panic, but I can smell the oven.",
    "Vote ham.",
  ];
  if (dishes.length === 0) lines.push("An empty table? I like my odds.");
  if (dishes.length > 0 && !has("desserts")) lines.push("No dessert yet? Bold move, family.");
  if (dishes.length > 0 && !has("drinks")) lines.push("Nobody's bringing drinks? Dry year.");
  if (dishes.length > 0 && !has("supplies")) lines.push("Eating with your hands, then? No plates yet.");
  if (dishes.filter(d => d.category === "desserts").length >= 4) lines.push("That's a lot of dessert. I respect it.");
  if (dishes.some(d => /turkey/i.test(d.item))) lines.push("Somebody wrote 'turkey'. We need to talk.");
  if (dishes.length >= 12) lines.push("This table is groaning. So am I.");
  let line;
  do { line = pick(lines); } while (line === $("bubble").textContent && lines.length > 1);
  return line;
}
$("turkey").addEventListener("click", () => say(turkeyLine()));

/* ---------- little touches ---------- */
function leaves() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 16; i++) {
    const l = el("div", "leaf", pick(["🍂", "🍁", "🍂", "🌰"]));
    l.style.left = Math.random() * 100 + "vw";
    l.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
    l.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
    l.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
    l.style.animationDelay = (Math.random() * 0.5) + "s";
    l.addEventListener("animationend", () => l.remove());
    document.body.append(l);
  }
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
(function countdown() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((PARTY_DATE - today) / 86400000);
  $("countdown").textContent =
    days > 1 ? `${days} days until we eat` :
    days === 1 ? "Tomorrow! Loosen your belt." :
    days === 0 ? "It's today. Come hungry." :
    "Hope you saved room for leftovers.";
})();

if (!configured) {
  $("banner").hidden = false;
  $("banner").textContent = "Preview mode: the shared list isn't connected yet, so what you add is saved on this device only.";
}
render();
refresh();
store.watch(refresh);
</script>
</body>
</html>
